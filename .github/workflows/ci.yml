name: CI

# Pull requests run the Linux checks (format, clippy, tests), the dependency
# check, and the macOS app build so each pull request can be tried on a Mac.
# The Windows checks and the Windows app build run after a merge to main, or
# for any branch from the Actions tab (Run workflow).
# Releases build every platform in release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "docs/**", "openspec/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run for the push before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Pull requests that only touch docs skip the checks below. Skipping them
    # here instead of with paths-ignore lets them report as passed, so a
    # docs-only pull request isn't left waiting on required checks.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!website/**"
              - "!docs/**"
              - "!openspec/**"
              - "!**/*.md"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        # mesa-vulkan-drivers provides lavapipe, a software Vulkan driver, so the
        # waveform shader test runs on CI machines without a GPU. cmake and
        # libclang build Ableton Link.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libasound2-dev mesa-vulkan-drivers cmake libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Website's list of supported controls is up to date
        # The docs' controller pages mark the mapping lines openDJ doesn't
        # support from this list. Regenerate it with the command below.
        run: |
          cargo run -q -p opendj -- --list-controls > /tmp/controls.txt
          diff -u website/book/supported-controls.txt /tmp/controls.txt

  windows:
    if: github.event_name != 'pull_request'
    # Windows ships as a preview: the app must build and its tests pass there
    # too. windows-latest already has the cmake and LLVM that Ableton Link needs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dependencies:
    # Known vulnerabilities in dependencies, and licences that can't ship in a
    # GPL app (see deny.toml).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  macos-app:
    # Builds an unsigned openDJ.app for Apple Silicon and attaches it to the run,
    # so the app can be tried without installing Rust.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p opendj
      - run: scripts/bundle-macos.sh target/release/opendj 0.1.0
      - uses: actions/upload-artifact@v7
        with:
          name: opendj-macos
          path: dist/opendj-macos.zip

  windows-app:
    if: github.event_name != 'pull_request'
    # The Windows setup and portable zip, attached to the run so the app can
    # be tried in a Windows VM without installing Rust.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p opendj
      - run: scripts/bundle-windows.ps1 target/release/opendj.exe 0.0.0-dev
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: opendj-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["website/**"]
  pull_request:
    paths-ignore: ["website/**"]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        # mesa-vulkan-drivers provides lavapipe, a software Vulkan driver, so the
        # waveform shader test runs on CI machines without a GPU. cmake and
        # libclang build Ableton Link.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libasound2-dev mesa-vulkan-drivers cmake libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Website's list of supported controls is up to date
        # The docs' controller pages mark the mapping lines openDJ doesn't
        # support from this list. Regenerate it with the command below.
        run: |
          cargo run -q -p opendj -- --list-controls > /tmp/controls.txt
          diff -u website/book/supported-controls.txt /tmp/controls.txt

  windows:
    # Windows ships as a preview: the app must build and its tests pass there
    # too. windows-latest already has the cmake and LLVM that Ableton Link needs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dependencies:
    # Known vulnerabilities in dependencies, and licences that can't ship in a
    # GPL app (see deny.toml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  macos-app:
    # Builds an unsigned openDJ.app for Apple Silicon and attaches it to the run,
    # so the app can be tried without installing Rust.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p opendj
      - run: scripts/bundle-macos.sh target/release/opendj 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: opendj-macos
          path: dist/opendj-macos.zip

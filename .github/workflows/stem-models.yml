name: Publish stem models

# Builds the stem separation models openDJ downloads the first time it needs
# them (Spleeter converted from Deezer's checkpoint, HTDemucs as safetensors),
# and fetches the Beat This! beat detection models (ONNX, from beat-this-rs),
# checks them against scripts/models/SHA256SUMS, which the app pins too, and
# attaches them to the `stem-models` pre-release. Run it by hand from the
# Actions tab once, and again when a model is added. Models already on the
# release are kept as they are: the Spleeter conversion isn't byte-for-byte
# repeatable across TensorFlow builds, and the app pins the published bytes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Keep the models already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download stem-models -D models 2>/dev/null || true
          ls -l models
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Convert Spleeter, fetch HTDemucs
        if: hashFiles('models/spleeter-4stems.safetensors') == '' || hashFiles('models/htdemucs.safetensors') == ''
        run: |
          pip install tensorflow-cpu==2.21.0 numpy==2.5.4 safetensors==0.8.0
          mkdir -p models work/4stems
          curl -sSfL -o work/4stems.tar.gz https://github.com/deezer/spleeter/releases/download/v1.4.0/4stems.tar.gz
          tar xzf work/4stems.tar.gz -C work/4stems
          python3 scripts/models/convert_spleeter.py work/4stems/model models/spleeter-4stems.safetensors
          curl -sSfL -o models/htdemucs.safetensors https://huggingface.co/set-soft/audio_separation/resolve/main/Demucs/htdemucs.safetensors
      - name: Fetch Beat This!
        if: hashFiles('models/beat-this-mel.onnx') == '' || hashFiles('models/beat-this-small.onnx') == ''
        run: |
          base=https://raw.githubusercontent.com/danigb/beat-this-rs/1ae768e78f1ad83b0ed3886241dc29ffde853c40/models
          curl -sSfL -o models/beat-this-mel.onnx "$base/mel_spectrogram.onnx"
          curl -sSfL -o models/beat-this-small.onnx "$base/beat_this_small.onnx"
      - name: Check them against the pinned checksums
        working-directory: models
        run: sha256sum -c ../scripts/models/SHA256SUMS
      - name: Attach them to the stem-models pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view stem-models >/dev/null 2>&1; then
            gh release create stem-models --prerelease --target "$GITHUB_SHA" \
              --title "Stem separation models" \
              --notes "Models openDJ downloads the first time it needs them: Spleeter 4stems (MIT, Deezer) for stems on load, HTDemucs (MIT, Meta) for high-quality stems, and Beat This! (MIT, JKU Linz) for beats and downbeats. Not an app release."
          fi
          gh release upload stem-models models/*.safetensors models/*.onnx --clobber

# Groups merged pull requests by label in the "What's changed" list that
# GitHub adds under docs/release-notes.md when a release is published.
changelog:
  exclude:
    authors: [dependabot, "dependabot[bot]"]
  categories:
    - title: New features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [fix, bug]
    - title: Docs and website
      labels: [docs, documentation]
    - title: Build and CI
      labels: [ci, dependencies, github_actions]
    - title: Other changes
      labels: ["*"]

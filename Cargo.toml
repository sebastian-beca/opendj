[workspace]
resolver = "2"
members = ["crates/control", "crates/engine", "crates/controllers", "crates/waveform", "crates/library", "crates/plugins", "crates/separation", "crates/stem-bench", "crates/script", "crates/app"]
exclude = ["third_party"]

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "GPL-2.0-or-later"

# Decoding, analysis and synthesis are far too slow unoptimised, even in tests.
[profile.dev.package.mixxx-engine]
opt-level = 2

[profile.dev.package.symphonia-core]
opt-level = 2

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2

[profile.dev.package.symphonia-bundle-flac]
opt-level = 2

[profile.dev.package.signalsmith-stretch]
opt-level = 2

# femtovg (Slint's renderer) with a fix for its pipeline cache, which threw
# away pipelines each flush and rebuilt them every frame. See
# third_party/femtovg/OPENDJ.md.
[patch.crates-io]
femtovg = { path = "third_party/femtovg" }

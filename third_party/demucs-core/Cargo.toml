[package]
name = "demucs-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HTDemucs v4 in Rust on burn, from github.com/nikhilunni/demucs-rs (see OPENDJ.md)"

[features]
default = []
# `burn/simd` is listed explicitly: burn depends on burn-ndarray with
# default-features = false, so burn-ndarray's own defaults (`std`, `simd`,
# `multi-threads`) are only restored by `burn/default` — which we turn off
# below. Without this, `demucs-core/ndarray` silently drops SIMD kernels.
# `std` still arrives via `burn/std`. Note `multi-threads` (rayon) has no
# passthrough on the burn facade and is NOT recoverable here; a consumer that
# needs it must depend on burn-ndarray directly.
ndarray = ["burn/ndarray", "burn/simd"]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
autotune = ["burn/autotune"]
fusion = ["burn/fusion"]

[dependencies]
realfft = "3.5.0"
# default-features = false so we don't drag in `burn/default`, which activates
# `burn-wgpu?/default` → the wgpu backend's `fusion` + `autotune` features. On
# Apple mobile GPUs autotune benchmarks dozens of kernel variants per shape on
# first inference and hangs the device. Consumers opt into fusion/autotune via
# this crate's own `fusion`/`autotune` features (see [features]); everything
# demucs-core needs (tensor, nn, module) lives in non-optional burn sub-crates
# that only require `std`.
burn = { version = "0.20.1", default-features = false, features = ["std"] }
safetensors = "0.5"
half = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"

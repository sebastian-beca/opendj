# cargo-deny: checks dependencies for security advisories and for licences
# that can't be shipped inside a GPL application. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on vulnerabilities. These unmaintained crates come in through other
# dependencies and have no known vulnerability.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained, pulled in by other crates" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, unmaintained, pulled in by the font stack" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, unmaintained, pulled in by Slint's accessibility (zbus)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, unmaintained, pulled in by Slint's accessibility (zbus)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, unmaintained, pulled in by Slint's accessibility (zbus)" },
]

[licenses]
# Everything here is compatible with distributing openDJ under GPL-3.0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

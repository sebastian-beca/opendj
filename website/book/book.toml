[book]
title = "openDJ Docs"
authors = ["The openDJ contributors"]
language = "en"
src = "src"

[build]
build-dir = "../dist/docs"
create-missing = false

[output.html]
site-url = "/docs/"
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/sebastian-beca/opendj"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/sebastian-beca/opendj/edit/main/website/book/{path}"
additional-css = ["theme/opendj.css"]
additional-js = ["theme/opendj.js"]
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20

# Pages that moved, so old links keep working.
[output.html.redirect]
"/guide/library-health.html" = "collection-health.html"

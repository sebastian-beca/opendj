[package]
name = "opendj-engine"
description = "Audio engine: decks, mixer and output, driven through Mixxx controls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opendj-control = { path = "../control" }
opendj-separation = { path = "../separation" }
# Plugins run in a helper process; the engine only needs the client side.
opendj-plugin-host = { path = "../plugin-host", default-features = false }
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
lofty = "0.25"
rtrb = "0.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rustfft = "6"
matrixmultiply = { version = "0.3", features = ["std"] }
signalsmith-stretch = "0.1"
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rusty_link = "0.4"
# MIDI clock out to drum machines and other apps.
midir = "0.11"
flacenc = { version = "0.5", default-features = false }
# Beat and downbeat tracking (Beat This!, MIT) on the pure-Rust rten runtime.
beat-this = { version = "1.1", default-features = false }
# The Groove Box's Analog and Synthetic kits: Mutable Instruments Plaits'
# drum models (MIT). Not on crates.io, so pinned to a commit.
mi-plaits-dsp = { git = "https://github.com/sourcebox/mi-plaits-dsp-rs", rev = "effe9864bb67d23aaf5724722ac1ce165d4e7c9f" }

# Real-time priority for the audio thread, which cpal only asks for with
# this feature (Core Audio's callbacks on macOS already run real-time).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["realtime"] }

[target.'cfg(windows)'.dependencies]
# ASIO drivers next to Windows Audio. The build downloads Steinberg's ASIO
# SDK (GPLv3), so Windows builds are distributed under GPLv3.
cpal = { version = "0.18", features = ["asio", "realtime"] }

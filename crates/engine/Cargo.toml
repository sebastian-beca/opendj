[package]
name = "mixxx-engine"
description = "Audio engine: decks, mixer and output, driven through Mixxx controls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mixxx-control = { path = "../control" }
mixxx-separation = { path = "../separation" }
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
lofty = "0.25"
rtrb = "0.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rustfft = "6"
matrixmultiply = { version = "0.3", features = ["std"] }
signalsmith-stretch = "0.1"
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rusty_link = "0.4"
flacenc = { version = "0.5", default-features = false }

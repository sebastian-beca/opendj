[package]
name = "opendj-test-clap"
description = "A tiny CLAP effect for openDJ's plugin-host tests: stereo gain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = ["clack-plugin", "params", "audio-ports", "latency"] }

[package]
name = "opendj-export"
description = "Writes the library to a USB stick that Pioneer DJ players read: export.pdb, OneLibrary and analysis files"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mixxx-engine = { path = "../engine" }
rbox-devlib = "0.3.0"
rbox-onelib = { version = "0.3.0", default-features = false }
rbox-anlz = "0.3.0"
rbox-db = { version = "0.3.0", default-features = false }
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = "0.7"
unicode-normalization = "0.1"
tempfile = "3"

# OneLibrary is SQLCipher. macOS builds it on CommonCrypto; Linux builds
# OpenSSL in, so the AppImage needs no system libcrypto.
[target.'cfg(target_vendor = "apple")'.dependencies]
rbox-onelib = { version = "0.3.0", default-features = false, features = ["bundled"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rbox-onelib = { version = "0.3.0", default-features = false, features = ["bundled-vendored-openssl"] }

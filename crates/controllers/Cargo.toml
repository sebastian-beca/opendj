[package]
name = "opendj-controllers"
description = "MIDI controller support driven by Mixxx's own controller mappings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opendj-control = { path = "../control" }
opendj-script = { path = "../script" }
midir = "0.11"
roxmltree = "0.21"
rquickjs = { version = "0.14", features = ["classes", "properties"] }
serde_json = "1"

[dev-dependencies]
opendj-engine = { path = "../engine" }

[package]
name = "opendj-separation"
description = "Stem separation in-process: Spleeter for instant stems, HTDemucs for high quality, on the GPU or CPU"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
demucs-core = { path = "../../third_party/demucs-core", features = ["ndarray", "wgpu", "fusion", "autotune"] }
burn = { version = "0.20.1", default-features = false, features = ["std", "ndarray", "simd", "wgpu", "fusion", "autotune"] }
burn-ndarray = { version = "0.20.1", features = ["multi-threads"] }
realfft = "3.5"
matrixmultiply = { version = "0.3", features = ["std"] }
safetensors = "0.7"
half = "2"
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "0.20.1", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.20.1", default-features = false, features = ["vulkan"] }

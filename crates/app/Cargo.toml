[package]
name = "opendj"
description = "A Rust DJ application, compatible with Mixxx"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
opendj-control = { path = "../control" }
opendj-controllers = { path = "../controllers" }
opendj-script = { path = "../script" }
opendj-engine = { path = "../engine" }
opendj-library = { version = "0.4.5", path = "../library" }
opendj-export = { path = "../export" }
opendj-plugins = { path = "../plugins" }
opendj-waveform = { path = "../waveform" }
serde_json = "1"
sha2 = "0.10"
read-fonts = "0.41"
ring = "0.17"
rusty-chromaprint = "0.3"
skrifa = "0.44"
slint = { version = "~1.18", features = ["unstable-wgpu-30", "unstable-fontique-011", "unstable-winit-030", "renderer-femtovg-wgpu"] }
ureq = { version = "3", features = ["json"] }
write-fonts = "0.50"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Where the pointer is when files are dropped from a file manager (X11).
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSString"] }

[target.'cfg(windows)'.dependencies]
# The system's own Open dialog (macOS and Linux ask osascript and zenity).
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "~1.18"

[target.'cfg(windows)'.build-dependencies]
# Puts the icon and version into openDJ.exe, for Explorer and the taskbar.
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
hound = "3"

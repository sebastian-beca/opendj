[package]
name = "opendj"
description = "A Rust DJ application, compatible with Mixxx"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Media keys and the system's Now Playing: MPNowPlayingInfoCenter on macOS,
# SystemMediaTransportControls on Windows, MPRIS over pure-Rust zbus on Linux.
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
opendj-broadcast = { path = "../broadcast" }
opendj-control = { path = "../control" }
opendj-controllers = { path = "../controllers" }
opendj-script = { path = "../script" }
opendj-engine = { path = "../engine" }
rtrb = "0.4"
opendj-library = { version = "0.7.0", path = "../library" }
opendj-export = { path = "../export" }
opendj-plugins = { path = "../plugins" }
opendj-remote = { path = "../remote" }
opendj-osc = { path = "../osc" }
# Bonjour: tablets find the OSC port on the network.
md5 = "0.8"
mdns-sd = "0.21"
opendj-waveform = { path = "../waveform" }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
read-fonts = "0.41"
ring = "0.17"
rusty-chromaprint = "0.3"
skrifa = "0.44"
# The disk's size and free room, for Settings › Collection › Storage.
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
slint = { version = "~1.18", features = ["unstable-wgpu-30", "unstable-fontique-011", "unstable-winit-030", "renderer-femtovg-wgpu"] }
ureq = { version = "3", features = ["json"] }
write-fonts = "0.50"
# Sample packs travel as .opendjpack zips.
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Broadcast passwords live in the system's keychain: Keychain on macOS,
# Credential Manager on Windows, the Secret Service (pure Rust, over D-Bus)
# on Linux.
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3.6"
features = ["apple-native"]

[target.'cfg(windows)'.dependencies.keyring]
version = "3.6"
features = ["windows-native"]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.keyring]
version = "3.6"
features = ["async-secret-service", "async-io", "crypto-rust"]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Where the pointer is when files are dropped from a file manager (X11).
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSObject", "NSString"] }

[target.'cfg(windows)'.dependencies]
# The system's own Open dialog (macOS and Linux ask osascript and zenity).
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "~1.18"

[target.'cfg(windows)'.build-dependencies]
# Puts the icon and version into openDJ.exe, for Explorer and the taskbar.
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
hound = "3"

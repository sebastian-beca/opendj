[package]
name = "opendj-broadcast"
description = "Live broadcasting: encodes the master and streams it to Icecast and Shoutcast servers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
mp3lame-encoder = "0.2"
ogg = "0.9"
opendj-control = { path = "../control" }
opus = "0.4"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webpki-roots = "1"

[package]
name = "opendj-plugins"
description = "Plugins: store search (Bandcamp and links to other stores) and the purchase inbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opendj-engine = { path = "../engine" }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
roxmltree = "0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
rbox-masterdb = { version = "0.3.0", default-features = false }
rbox-anlz = "0.3.0"
rbox-core = "0.3.0"

# rekordbox's master.db is SQLCipher, built as in opendj-export: on
# CommonCrypto on macOS, with OpenSSL built in elsewhere.
[target.'cfg(target_vendor = "apple")'.dependencies]
rbox-masterdb = { version = "0.3.0", default-features = false, features = ["bundled"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rbox-masterdb = { version = "0.3.0", default-features = false, features = ["bundled-vendored-openssl"] }

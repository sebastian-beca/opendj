[package]
name = "opendj-plugins"
description = "Plugins: store search (Bandcamp and links to other stores) and the purchase inbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opendj-engine = { path = "../engine" }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }

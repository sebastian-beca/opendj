[package]
name = "mixxx-waveform"
description = "GPU waveform renderer (wgpu) that draws into textures the Slint UI displays"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Must stay on the same major version as Slint's `unstable-wgpu-30` feature so
# both render with the same wgpu::Device.
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
wgpu = { version = "30", features = ["vulkan", "wgsl"] }
pollster = "0.4"
